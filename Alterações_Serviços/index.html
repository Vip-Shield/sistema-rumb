<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Alterações & Avarias - RUMB</title>
    <link rel="shortcut icon" type="imagex/png" href="../IMAGENS/caveira.ico">

<style>
  /* ESTILO GERAL - Visual Tático/Escuro */
  body { 
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
    background: #1a1a1d; 
    color: #e0e0e0; 
    padding: 20px; 
    padding-top: 110px; 
    font-size: 12px; 
  }
  
  /* CABEÇALHO FIXO */
  .header { 
    position: fixed; 
    top: 0;
    left: 0;
    width: 100%;
    background: #1a1a1d; 
    z-index: 1000; 
    box-sizing: border-box; 
    padding: 10px 20px; 
    display: grid; 
    grid-template-columns: 60px 1fr 60px; 
    align-items: center; 
    border-bottom: 2px solid #c3073f; 
    box-shadow: 0 4px 10px rgba(0,0,0,0.5); 
  }

  .titulo h1 { text-align: center; font-size: 18px; margin: 0; color: #c3073f; text-transform: uppercase; letter-spacing: 1px; }
  .titulo p { text-align: center; margin: 5px 0; color: #950740; font-weight: bold; }

  /* SELEÇÃO DE DEMANDA */
  .menu-selection {
    background: #4e4e50;
    padding: 15px;
    border-radius: 8px;
    text-align: center;
    margin-bottom: 20px;
    border: 1px solid #6f2232;
  }
  
  select {
    padding: 10px;
    font-size: 14px;
    border-radius: 5px;
    width: 100%;
    max-width: 400px;
    background: #1a1a1d;
    color: white;
    border: 1px solid #c3073f;
    font-weight: bold;
  }

  /* ÁREA DO PROTOCOLO (DINÂMICA) */
  .protocolo-container {
    background: #2b2b2d;
    padding: 20px;
    border-radius: 8px;
    border-left: 5px solid #c3073f;
    margin-bottom: 20px;
    display: none; 
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
  }

  .protocolo-titulo { font-size: 14px; color: #c3073f; font-weight: bold; text-transform: uppercase; margin-bottom: 10px; border-bottom: 1px solid #444; padding-bottom: 5px; }
  .instrucao { margin-bottom: 15px; color: #fff; background: #333; padding: 10px; border-radius: 4px; border: 1px dashed #666; line-height: 1.5; }
  
  /* FORMULÁRIOS INTERNOS */
  .campo-grupo { margin-bottom: 10px; }
  label { display: block; color: #aaa; margin-bottom: 3px; font-weight: bold; font-size: 10px; }
  input, textarea, select.form-control { width: 98%; padding: 8px; background: #1a1a1d; border: 1px solid #444; color: white; border-radius: 4px; box-sizing: border-box;}
  textarea { height: 60px; resize: none; }
  
  /* CHECKBOX E RADIO CUSTOMIZADOS PARA ESPARGIDOR */
  .checkbox-group {
    background: #3a3a3c;
    padding: 10px;
    border-radius: 4px;
    margin-bottom: 10px;
  }
  .checkbox-group label {
    display: inline-flex;
    align-items: center;
    margin-right: 15px;
    color: #fff;
    cursor: pointer;
    font-size: 11px;
  }
  .checkbox-group input[type="radio"], .checkbox-group input[type="checkbox"] {
    width: auto;
    margin-right: 5px;
  }
  .sub-titulo {
    color: #ffd700;
    font-size: 11px;
    margin-bottom: 5px;
    text-transform: uppercase;
    border-bottom: 1px solid #555;
    padding-bottom: 2px;
  }

  /* BOTÕES */
  .btn-area { display: flex; gap: 10px; margin-top: 15px; }
  button { padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; text-transform: uppercase; color: white; flex: 1; }
  
  .btn-email { background: #0056b3; } 
  .btn-email:hover { background: #004494; }

  .btn-salvar { background: #15803d; } 
  .btn-salvar:hover { background: #166534; }

  .btn-alerta { background: #b91c1c; }
  .btn-alerta:hover { background: #991b1b; }

  .btn-whatsapp { background: #25D366; }
  .btn-whatsapp:hover { background: #1da851; }

  /* BOTÕES DE AÇÕES DA TABELA */
  .btn-acao {
    padding: 6px 8px;
    font-size: 12px;
    margin: 2px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    color: white;
    font-weight: bold;
    flex: none;
    display: inline-block;
  }
  .btn-acao-editar { background-color: #d97706; }
  .btn-acao-editar:hover { background-color: #b45309; }
  .btn-acao-apagar { background-color: #dc2626; }
  .btn-acao-apagar:hover { background-color: #b91c1c; }
  .btn-acao-email { background-color: #2563eb; }
  .btn-acao-email:hover { background-color: #1d4ed8; }

  /* TABELA DE REGISTROS */
  table { width: 100%; border-collapse: collapse; margin-top: 10px; background: #fff; color: #000; }
  th, td { border: 1px solid #999; padding: 6px; text-align: left; font-size: 11px; }
  th { background: #6f2232; color: white; text-transform: uppercase; }
  tr:nth-child(even) { background: #f2f2f2; }
  
  .status-email { color: blue; font-weight: bold; }
  .status-avaria { color: #c3073f; font-weight: bold; }
  .status-gas { color: #d97706; font-weight: bold; } 
  .status-critico { color: #fff; background-color: #dc2626; font-weight: bold; padding: 2px 4px; border-radius: 3px; display: inline-block;} 
  .status-alerta-email { color: #991b1b; background-color: #fecaca; font-weight: bold; padding: 2px 4px; border-radius: 3px; display: inline-block; border: 1px solid #ef4444; }
  .status-pendencia-cop { color: #000; background-color: #fcd34d; font-weight: bold; padding: 2px 4px; border-radius: 3px; display: inline-block; border: 1px solid #d97706; }
  
  .col-acoes { text-align: center; white-space: nowrap; width: 110px; }

  /* BARRA DE FERRAMENTAS */
  .toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #444;
    padding-bottom: 10px;
    margin-top: 30px;
    flex-wrap: wrap;
    gap: 10px;
  }
  .toolbar h3 { margin: 0; color: #e0e0e0; }
  .toolbar-btns { display: flex; gap: 5px; }
  .btn-tool { padding: 6px 12px; font-size: 10px; border-radius: 4px; cursor: pointer; border: none; color: white; font-weight: bold; }
  .btn-backup { background: #059669; }
  .btn-restore { background: #d97706; }
  .btn-clear { background: #b91c1c; }
  .btn-pdf { background: #2563eb; }

  /* CONFIGURAÇÃO PARA IMPRESSÃO / GERAÇÃO DE PDF */
  @media print {
    body { 
      background: white; 
      color: black; 
      padding: 0; 
      padding-top: 10px;
    }
    .header, .menu-selection, #areaProtocolo, .toolbar-btns, .col-acoes { 
      display: none !important; 
    }
    .toolbar { 
      border-bottom: none; 
      margin-top: 0; 
      justify-content: center;
    }
    .toolbar h3 { 
      color: black; 
      font-size: 18px; 
      text-align: center; 
      margin-bottom: 15px;
    }
    table { width: 100%; border-collapse: collapse; }
    th, td { 
      border: 1px solid #000; 
      padding: 5px; 
      font-size: 10px; 
      color: black !important; 
    }
    th { 
      background: #ccc !important; 
      color: black !important; 
      -webkit-print-color-adjust: exact; 
      print-color-adjust: exact;
    }
    .status-critico, .status-alerta-email, .status-pendencia-cop { 
      background: transparent; 
      color: black; 
      border: none; 
      font-weight: bold; 
    }
  }

</style>

        datalistCameras.appendChild(option);

    document.body.appendChild(datalistCameras);

    let datalistRumb = document.createElement('datalist');
    datalistRumb.id = 'listaRumb';
    equipeRUMB.forEach(membro => {
        let option = document.createElement('option');
        option.value = membro;
        datalistRumb.appendChild(option);
    });
    document.body.appendChild(datalistRumb);
  }

  function cobrarCameraWhatsApp() {
    const serial = document.getElementById('serialItem').value.trim();
    const policial = document.getElementById('usuarioMaterial').value.trim();
    let zap = document.getElementById('zapPolicial').value.replace(/\D/g, '');
    const turno = document.getElementById('turnoPolicial').value.trim();

    if(!serial || !policial || !zap) {
      alert("Para cobrar via WhatsApp, preencha o Serial, o Nome do Policial e o número de WhatsApp.");
      return;
    }

    if (!zap.startsWith('55')) {
        zap = '55' + zap;
    }

    const textoMensagem = `*RUMB - ALERTA DE MATERIAL*\n\n` +
                          `👮‍♂️ Policial: *${policial.toUpperCase()}*\n` +
                          `⚠️ Verificamos que a Câmera Operacional (COP) ID: *${serial}*, cautelada para o seu turno (${turno}), ainda não consta como devolvida na Reserva de Armas.\n\n` +
                          `Favor informar o paradeiro do equipamento ou providenciar a devolução imediatamente para evitarmos a confecção de Parte de Alteração.\n\n` +
                          `_Mensagem do Sistema de Controle da RUMB._`;

    const urlFormatada = `https://wa.me/${zap}?text=${encodeURIComponent(textoMensagem)}`;
    window.open(urlFormatada, '_blank');
  }

  function abrirEmail(tipo) {
    const serial = document.getElementById('serialItem').value;
    const defeito = document.getElementById('descDefeito').value;
    const usuario = document.getElementById('usuarioMaterial').value;
    const quartilheiro = document.getElementById('quartilheiroMomento').value;
    const resp = document.getElementById('respRumb').value;
    
    if(!serial || !defeito) { 
        alert("Informe o Serial (ou Localização da Dockstation) e a Descrição do defeito para gerar o e-mail."); 
        return; 
    }

    emailClicado = true; 

    const assunto = `ABERTURA DE CHAMADO - ${tipo} - SERIAL/ID: ${serial}`;
    
    const corpo = `Solicito abertura de chamado técnico para o material abaixo:\n\n` +
                  `TIPO: ${tipo}\n` +
                  `SERIAL/ID: ${serial}\n` +
                  `DEFEITO: ${defeito}\n` +
                  (tipo === 'DOCKSTATION' ? `USUÁRIO: Equipamento Fixo (Sem autor)\n` : `USUÁRIO (QUEM ESTAVA): ${usuario}\n`) +
                  `QUARTILHEIRO (NO MOMENTO): ${quartilheiro}\n` +
                  `RESPONSÁVEL PELO REGISTRO: ${resp}\n\n` +
                  `UNIDADE: 3ª UPP/19°BPM - CIA TABAJARAS\n` +
                  `SETOR: RUMB\n` +
                  `ENDEREÇO: ${ENDERECO_UNIDADE}`;

    const href = `mailto:${EMAIL_DESTINO}?cc=${EMAIL_ORIGEM}&subject=${encodeURIComponent(assunto)}&body=${encodeURIComponent(corpo)}`;
    window.location.href = href;
  }

  function salvarRegistro(tipo, status) {
    const serial = document.getElementById('serialItem').value;
    const defeito = document.getElementById('descDefeito') ? document.getElementById('descDefeito').value.trim() : '';
    const usuario = document.getElementById('usuarioMaterial').value;
    const resp = document.getElementById('respRumb').value;

    if(!serial || !resp || !usuario || !defeito) { 
        alert("Preencha todos os campos obrigatórios (Série/ID, Usuário, RUMB e a Descrição da Alteração/Relato)."); 
        return; 
    }

    let detalheFinal = "";
    let responsavelFinal = "";
    let quartilheiroSalvamento = "N/A";

    if (tipo === 'NAO_DEVOLUCAO') {
        const turno = document.getElementById('turnoPolicial').value || "Não inf.";
        const hora = document.getElementById('horaConstatacao').value || "Não inf.";
        const oficial = document.getElementById('oficialComunicado').value || "Nenhum";

        detalheFinal = `<span class="status-critico">🚨 PENDÊNCIA DE MATERIAL</span> [Turno: ${turno} | Constatado às: ${hora}]. Contato: ${defeito}. Oficial Cientificado: ${oficial}. Fundamento: RDPMERJ Itens 40 e 45.`;
        responsavelFinal = `RUMB: ${resp.toUpperCase()}`;

    } else if (tipo === 'NAO_DEVOLUCAO_COP') {
        const turno = document.getElementById('turnoPolicial').value || "Não inf.";
        const oficial = document.getElementById('oficialComunicado').value || "N/C";
        
        detalheFinal = `<span class="status-pendencia-cop">⚠️ PENDÊNCIA DE COP</span> [Turno: ${turno}]. Relato: ${defeito}. Oficial: ${oficial}.`;
        responsavelFinal = `RUMB: ${resp.toUpperCase()}`;

    } else if (tipo === 'GAS') {
        const hora = document.getElementById('horaDevolucao').value || "N/Inf";
        const ro = document.getElementById('roOcorrencia').value || "S/N";
        
        const radios = document.getElementsByName('estadoGas');
        let estadoSel = "Não informado";
        for (let r of radios) { if (r.checked) estadoSel = r.value; }

        let providencias = [];
        if(document.getElementById('provSubst').checked) providencias.push("Substituição");
        if(document.getElementById('provRepos').checked) providencias.push("Reposição");
        if(document.getElementById('provComunic').checked) providencias.push("Comunicação Sup.");
        const provOutra = document.getElementById('provOutra').value;
        if(provOutra) providencias.push(provOutra);

        const obsFisica = document.getElementById('obsGas').value;

        detalheFinal = `[RO: ${ro}] [Estado: ${estadoSel}] - Relato: ${defeito}. Obs: ${obsFisica}. Providências: ${providencias.join(', ')}. (Hora dev: ${hora})`;
        responsavelFinal = `Conf. RUMB: ${resp.toUpperCase()}`;

    } else {
        quartilheiroSalvamento = document.getElementById('quartilheiroMomento').value || "N/A";
        
        let statusExibicao = status;
        if (tipo === 'COP' || tipo === 'BATERIA' || tipo === 'DOCKSTATION') {
            if (emailClicado) {
                statusExibicao = "CHAMADO ABERTO (E-MAIL ENVIADO)";
            } else {
                statusExibicao = "<span class='status-alerta-email'>⚠️ SALVO SEM E-MAIL DE SUPORTE</span>";
            }
        }
        
        detalheFinal = `<strong>${statusExibicao}</strong>: ${defeito}`;
        responsavelFinal = `${quartilheiroSalvamento.toUpperCase()} (Q) / ${resp.toUpperCase()} (R)`;
    }

    const registros = JSON.parse(localStorage.getItem('livroAlteracoesRumb')) || [];
    const agora = new Date();

    const novoReg = {
      data: agora.toLocaleString('pt-BR'),
      tipo: tipo === 'NAO_DEVOLUCAO' ? 'RETENÇÃO BÉLICA' : (tipo === 'NAO_DEVOLUCAO_COP' ? 'FALTA DE COP' : tipo),
      serial: serial,
      usuario: usuario.toUpperCase(),
      detalhe: detalheFinal,
      responsavel: responsavelFinal,
      tipoOriginal: tipo,
      defeitoOriginal: defeito,
      quartilheiroOriginal: quartilheiroSalvamento,
      rumbOriginal: resp
    };

    registros.push(novoReg);
    localStorage.setItem('livroAlteracoesRumb', JSON.stringify(registros));
    
    renderizarTabela();
    alert("Registro salvo com sucesso!");
    
    document.getElementById('selectMaterial').value = '';
    carregarProtocolo();
  }

  function renderizarTabela() {
    const registros = JSON.parse(localStorage.getItem('livroAlteracoesRumb')) || [];
    const tbody = document.getElementById('tbodyHistorico');
    tbody.innerHTML = '';

    const registrosComIndex = registros.map((reg, index) => ({ ...reg, originalIndex: index })).reverse();

    registrosComIndex.forEach(reg => {
      let classeStatus = '';
      if (reg.tipo === 'RETENÇÃO BÉLICA') classeStatus = 'status-avaria'; 
      else if (reg.tipo === 'FALTA DE COP') classeStatus = 'status-gas'; 
      else if (reg.detalhe.includes('CHAMADO')) classeStatus = 'status-email';
      else if (reg.tipo === 'GAS') classeStatus = 'status-gas';
      else classeStatus = 'status-avaria';

      const usuarioExibido = reg.usuario ? reg.usuario : '<span style="color:#aaa;">-</span>';

      let botoesAcao = `
        <button class="btn-acao btn-acao-editar" onclick="editarRegistro(${reg.originalIndex})" title="Editar Registro">✏️</button>
        <button class="btn-acao btn-acao-apagar" onclick="apagarRegistro(${reg.originalIndex})" title="Apagar Registro">🗑️</button>
      `;

      const tipoParaEmail = reg.tipoOriginal || reg.tipo;
      if (['COP', 'BATERIA', 'DOCKSTATION'].includes(tipoParaEmail)) {
        botoesAcao += `<button class="btn-acao btn-acao-email" onclick="reenviarEmail(${reg.originalIndex})" title="Abrir Chamado / Enviar E-mail">📧</button>`;
      }

      tbody.innerHTML += `
        <tr>
          <td>${reg.data}</td>
          <td style="font-weight:bold;">${reg.tipo}</td>
          <td>${reg.serial}</td>
          <td style="font-weight:bold; color:#444;">${usuarioExibido}</td>
          <td class="${classeStatus}">${reg.detalhe}</td>
          <td style="font-size:10px;">${reg.responsavel}</td>
          <td class="col-acoes">${botoesAcao}</td>
        </tr>
      `;
    });
  }
  
  function apagarRegistro(index) {
    if (confirm("🚨 TEM CERTEZA QUE DESEJA APAGAR ESTE REGISTRO?\nEsta ação não poderá ser desfeita.")) {
      const registros = JSON.parse(localStorage.getItem('livroAlteracoesRumb')) || [];
      registros.splice(index, 1);
      localStorage.setItem('livroAlteracoesRumb', JSON.stringify(registros));
      renderizarTabela();
    }
  }

  function editarRegistro(index) {
    const registros = JSON.parse(localStorage.getItem('livroAlteracoesRumb')) || [];
    const reg = registros[index];

    const novaData = prompt("📝 Editar Data/Hora:", reg.data);
    if (novaData !== null && novaData.trim() !== '') reg.data = novaData.trim();

    const novoSerial = prompt("📝 Editar Serial / ID:", reg.serial);
    if (novoSerial !== null && novoSerial.trim() !== '') reg.serial = novoSerial.trim();

    const novoUsuario = prompt("📝 Editar Usuário (Policial):", reg.usuario);
    if (novoUsuario !== null && novoUsuario.trim() !== '') reg.usuario = novoUsuario.trim().toUpperCase();

    let defeitoAtual = reg.defeitoOriginal || reg.detalhe.replace(/(<([^>]+)>)/gi, "");
    const novoDefeito = prompt("📝 Editar Relato / Descrição do Defeito:\n(Evite apagar tags de alerta HTML, apenas atualize o texto caso necessário)", defeitoAtual);
    
    if (novoDefeito !== null && novoDefeito.trim() !== '') {
        reg.defeitoOriginal = novoDefeito.trim();
        if (reg.detalhe.includes('</strong>:')) {
            const partes = reg.detalhe.split('</strong>:');
            reg.detalhe = partes[0] + '</strong>: ' + reg.defeitoOriginal;
        } else if (reg.detalhe.includes('</span>')) {
            const partes = reg.detalhe.split('</span>');
            reg.detalhe = partes[0] + '</span> ' + reg.defeitoOriginal;
        } else {
            reg.detalhe = reg.defeitoOriginal;
        }
    }

    registros[index] = reg;
    localStorage.setItem('livroAlteracoesRumb', JSON.stringify(registros));
    renderizarTabela();
  }

  function reenviarEmail(index) {
    const registros = JSON.parse(localStorage.getItem('livroAlteracoesRumb')) || [];
    const reg = registros[index];
    
    const tipo = reg.tipoOriginal || reg.tipo;
    const serial = reg.serial;
    const defeito = reg.defeitoOriginal || reg.detalhe.replace(/(<([^>]+)>)/gi, "");
    const usuario = reg.usuario;
    const quartilheiro = reg.quartilheiroOriginal || "N/I";
    const resp = reg.rumbOriginal || reg.responsavel;

    const assunto = `ABERTURA DE CHAMADO - ${tipo} - SERIAL/ID: ${serial}`;
    const corpo = `Solicito abertura de chamado técnico para o material abaixo:\n\n` +
                  `TIPO: ${tipo}\n` +
                  `SERIAL/ID: ${serial}\n` +
                  `DEFEITO: ${defeito}\n` +
                  (tipo === 'DOCKSTATION' ? `USUÁRIO: Equipamento Fixo (Sem autor)\n` : `USUÁRIO (QUEM ESTAVA): ${usuario}\n`) +
                  `QUARTILHEIRO (NO MOMENTO): ${quartilheiro}\n` +
                  `RESPONSÁVEL PELO REGISTRO: ${resp}\n\n` +
                  `UNIDADE: 3ª UPP/19°BPM - CIA TABAJARAS\n` +
                  `SETOR: RUMB\n` +
                  `ENDEREÇO: ${ENDERECO_UNIDADE}`;

    const href = `mailto:${EMAIL_DESTINO}?cc=${EMAIL_ORIGEM}&subject=${encodeURIComponent(assunto)}&body=${encodeURIComponent(corpo)}`;
    
    if (reg.detalhe.includes('SEM E-MAIL DE SUPORTE')) {
        reg.detalhe = reg.detalhe.replace("<span class='status-alerta-email'>⚠️ SALVO SEM E-MAIL DE SUPORTE</span>", "<strong>CHAMADO ABERTO (E-MAIL ENVIADO)</strong>");
        registros[index] = reg;
        localStorage.setItem('livroAlteracoesRumb', JSON.stringify(registros));
        renderizarTabela();
    }
    
    window.location.href = href;
  }

  function limparHistorico() {
    if(confirm("Tem certeza que deseja apagar todo o histórico de alterações?")) {
      localStorage.removeItem('livroAlteracoesRumb');
      renderizarTabela();
    }
  }

  function fazerBackup() {
    const dados = localStorage.getItem('livroAlteracoesRumb');
    if (!dados || dados === '[]') { alert("Nada para salvar!"); return; }
    
    const blob = new Blob([dados], {type: "application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `Livro_Alteracoes_RUMB_${new Date().toLocaleDateString('pt-BR').replace(/\//g,'-')}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }

  function restaurarBackup(input) {
    const file = input.files[0];
    if (!file) return;
    
    const reader = new FileReader();
    reader.onload = function(e) {
      try {
        const conteudoLimpo = e.target.result.trim().replace(/^\uFEFF/, '');
        const json = JSON.parse(conteudoLimpo);
        
        if (Array.isArray(json)) {
          if(confirm("ATENÇÃO: Isso substituirá o histórico atual pelos dados do arquivo. Continuar?")) {
            localStorage.setItem('livroAlteracoesRumb', JSON.stringify(json));
            renderizarTabela();
            alert("✅ Backup restaurado com sucesso!");
          }
        } else {
          alert("❌ Arquivo inválido. O formato dos dados está incorreto.");
        }
      } catch (err) {
        alert("❌ Erro ao ler arquivo. Certifique-se de que é um JSON válido.\nDetalhe: " + err.message);
      } finally {
        input.value = '';
      }
    };
    reader.readAsText(file);
  }

  // Inicialização
  window.onload = function() {
    criarDatalists();
    renderizarTabela();
  };

</script>
</body>
